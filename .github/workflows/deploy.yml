name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  # PR 也构建：死链、坏 frontmatter、组件语法错，都要在合并前发现
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # gen-index 会重新生成分类页和 /all 的索引 JSON，
      # 所以新加一篇 md 不用改配置，构建时会自动进侧边栏和搜索结果
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4